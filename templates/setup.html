{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;" class="fade-in">
  <div style="width:100%;max-width:440px;">
    <div style="text-align:center;margin-bottom:2.5rem;">
      <div style="font-family:var(--mono);font-size:2rem;font-weight:700;color:var(--accent);">MailOps</div>
      <div style="font-family:var(--mono);font-size:0.65rem;color:var(--text-dim);letter-spacing:0.2em;text-transform:uppercase;margin-top:0.3rem;">First-Run Setup</div>
    </div>
    <div class="card" style="border-color:var(--border-bright);">
      <div class="card-title">// Create Admin Account</div>
      <p style="color:var(--text-muted);font-size:0.82rem;margin-bottom:1.5rem;line-height:1.6;">
        One-time setup. Create the administrator account to access MailOps.
      </p>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" name="username" autocomplete="username" autofocus required placeholder="e.g. admin" minlength="3">
          <p class="form-hint">Minimum 3 characters.</p>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" autocomplete="new-password" required placeholder="••••••••" minlength="8">
          <p class="form-hint">Minimum 8 characters.</p>
        </div>
        <div class="form-group" style="margin-bottom:1.5rem;">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="confirm" autocomplete="new-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Create Account & Continue →</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
