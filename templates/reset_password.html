{% extends "base.html" %}
{% block title %}Set New Password — MailOps{% endblock %}
{% block content %}
<div style="display:flex;justify-content:center;align-items:center;min-height:72vh;">
  <div style="width:100%;max-width:420px;">
    <div class="card">
      <div style="text-align:center;margin-bottom:1.8rem;">
        <div style="font-size:2rem;font-weight:900;color:var(--accent);font-family:var(--mono);letter-spacing:-.02em;">MailOps</div>
        <div style="font-size:.75rem;color:var(--text-dim);font-family:var(--mono);margin-top:.25rem;">Set a new password</div>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }}" style="margin-bottom:1rem;">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div style="margin-bottom:1rem;">
          <label style="font-family:var(--mono);font-size:.7rem;color:var(--text-dim);display:block;margin-bottom:.35rem;">New Password (min. 8 characters)</label>
          <input type="password" name="password" required autofocus minlength="8"
            style="width:100%;padding:.6rem .8rem;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:.82rem;box-sizing:border-box;">
        </div>
        <div style="margin-bottom:1.2rem;">
          <label style="font-family:var(--mono);font-size:.7rem;color:var(--text-dim);display:block;margin-bottom:.35rem;">Confirm New Password</label>
          <input type="password" name="confirm" required minlength="8"
            style="width:100%;padding:.6rem .8rem;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:.82rem;box-sizing:border-box;">
        </div>
        <button type="submit" class="btn" style="width:100%;font-family:var(--mono);font-size:.78rem;">Update Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
